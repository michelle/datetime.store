services:
  - type: web
    name: datetime-store
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: sandbox
      - key: SITE_URL
        value: https://datetime.store
      - key: SUPPORT_EMAIL
        sync: false
      - key: PRODIGI_API_BASE
        value: https://api.sandbox.prodigi.com/v4.0
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRODIGI_API_KEY
        sync: false
